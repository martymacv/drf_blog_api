      properties:
        first_name:
          type: string
          maxLength: 20
        middle_name:
          type: string
          maxLength: 50
        last_name:
          type: string
          maxLength: 20
        profession:
          type: string
          title: Senior Product Manager | Growth & Monetization
          maxLength: 100
        city:
          type: string
          maxLength: 100
        country:
          type: string
          maxLength: 100
        relocation:
          type: string
          maxLength: 200
